# Builds the site and publishes the contents of dist/ to the "hostinger" branch.
# Hostinger's Git deployment pulls that branch into public_html (shared hosting cannot run the build itself).
name: Build and publish for Hostinger

on:
  push:
    branches: [main, claude/gallant-carson-sg8zly]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Publish dist/ to the hostinger branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir out && cd out
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin hostinger; then
            git checkout -q -B hostinger FETCH_HEAD
          else
            git checkout -q --orphan hostinger
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -q -m "Publish ${GITHUB_SHA::7}"
            git push -q origin hostinger
          fi
